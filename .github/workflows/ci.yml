name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Architecture rules
        run: swift test --package-path Architecture
      - name: Build benchmarks
        # Built, not run: CI machines are too noisy to compare. See docs/performance.md.
        env:
          BENCHMARK_DISABLE_JEMALLOC: "true"
        run: swift build --package-path Benchmarks
